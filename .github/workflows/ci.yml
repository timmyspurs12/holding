name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generated contract is current
        run: python scripts/render_contract.py --check
      - name: Tests
        run: pytest tests/ -q
        env:
          GENLAYER_NETWORK: demo
          HOLDING_DEMO_SEED: "false"
      - name: Demo loop runs end to end
        run: python scripts/demo_loop.py | tail -20
        env:
          GENLAYER_NETWORK: demo
